name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Unzip project if needed
      run: |
        if [ -f "DocumentToExcel_Android_Project.zip" ]; then
          unzip -o DocumentToExcel_Android_Project.zip
        fi

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build with Gradle
      run: |
        GRADLEW_PATH=$(find . -name "gradlew" | head -n 1)
        if [ -n "$GRADLEW_PATH" ]; then
          DIR=$(dirname "$GRADLEW_PATH")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "gradlew not found, looking for build.gradle..."
          BUILD_GRADLE=$(find . -name "build.gradle" -o -name "build.gradle.kts" | head -n 1)
          if [ -n "$BUILD_GRADLE" ]; then
            DIR=$(dirname "$BUILD_GRADLE")
            cd "$DIR"
            gradle assembleDebug
          else
            echo "No gradle configuration found."
            exit 1
          fi
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug.apk
        path: "**/*.apk"
